<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Two boards joined by through dovetails: maple above, walnut below. -->
  <defs>
    <clipPath id="tile">
      <rect x="12" y="20" width="104" height="88" rx="12"/>
    </clipPath>
    <linearGradient id="maple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9e1a8"/>
      <stop offset="1" stop-color="#e8b86a"/>
    </linearGradient>
    <linearGradient id="walnut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f6240"/>
      <stop offset="1" stop-color="#5e3d26"/>
    </linearGradient>
  </defs>
  <rect x="12" y="24" width="104" height="88" rx="12" fill="#3d2818" opacity="0.35"/>
  <g clip-path="url(#tile)">
    <rect x="12" y="20" width="104" height="88" fill="url(#walnut)"/>
    <path d="M12 74 C40 70 70 80 116 72 M12 92 C44 88 76 98 116 90" fill="none" stroke="#4a2f1c" stroke-width="2" opacity="0.6"/>
    <path d="M12 20 H116 V58 H101 L107 86 H81 L87 58 H71 L77 86 H51 L57 58 H41 L47 86 H21 L27 58 H12 Z" fill="url(#maple)"/>
    <path d="M12 32 C44 28 76 38 116 30 M12 46 C40 42 72 52 116 44" fill="none" stroke="#c98f45" stroke-width="2" opacity="0.7"/>
    <path d="M101 58 L107 86 H81 L87 58 M71 58 L77 86 H51 L57 58 M41 58 L47 86 H21 L27 58" fill="none" stroke="#3d2818" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
  </g>
  <rect x="13" y="21" width="102" height="86" rx="11" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.25"/>
</svg>
