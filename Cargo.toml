[workspace]
resolver = "3"
members = [
  "crates/stave-lang",
  "crates/stave-smt",
  "crates/stave-schema",
  "crates/stave-modules",
  "crates/stave-model",
  "crates/stave-solve",
  "crates/stave-geom",
  "crates/stave-check",
  "crates/stave-scene",
  "crates/stave-render",
  "crates/stave-ide",
  "crates/stave-app",
  "crates/stave-cli",
  "crates/stave-gtk",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "AGPL-3.0-or-later"

# z3 is compiled from C++ by the build script of `z3-sys` (through the
# `z3-src` crate and CMake), and CMake follows that package's opt-level: at
# the dev profile's 0 it builds z3 as Debug, with z3's own assertions, and a
# small smart-edit solve takes about 90ms. Built as Release here (the test
# profile inherits these), it takes a few milliseconds. See the crate docs
# of `stave-smt`, "Building z3", for the measurements.
[profile.dev.package.z3-sys]
opt-level = 3
debug = false

[profile.dev.package.z3]
opt-level = 3

# Lints every crate takes with `[lints] workspace = true`.
#
# `wildcard_enum_match_arm`: a `_ =>` arm on one of our enums swallows the
# variants added later, so a new `Value`, `RExprKind` or `Ty` variant falls
# silently into "ignore" or "None" instead of failing to compile. List the
# variants; where a wildcard is right (a projection that picks out one
# variant, a foreign or non-exhaustive enum, a deliberate "everything else"),
# write `#[expect(clippy::wildcard_enum_match_arm, reason = "...")]` on the
# narrowest enclosing statement or function (lint attributes on a match arm
# are not honoured), or use `if let` / `let ... else`. stave-gtk does not
# take these lints yet.
[workspace.lints.clippy]
wildcard_enum_match_arm = "warn"
