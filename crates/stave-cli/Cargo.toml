[package]
name = "stave-cli"
description = "The stave command: check, format and dump .stave projects"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "stave"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
stave-app = { path = "../stave-app" }
stave-lang = { path = "../stave-lang" }
stave-model = { path = "../stave-model" }
