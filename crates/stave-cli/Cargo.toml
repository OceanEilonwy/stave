[package]
name = "stave-cli"
description = "The stave command: check, format, dump, view and export .stave projects"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "stave"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
stave-app = { path = "../stave-app" }
stave-lang = { path = "../stave-lang" }
stave-mcp = { path = "../stave-mcp" }
stave-model = { path = "../stave-model" }
stave-modules = { path = "../stave-modules" }
stave-schema = { path = "../stave-schema" }

[dev-dependencies]
gltf = "1"
serde_json = "1"
stave-modules = { path = "../stave-modules" }

[lints]
workspace = true
