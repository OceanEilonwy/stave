[package]
name = "stave-lsp"
description = "Stave's language server: the editor features of stave-ide and the checks of stave-app over the language server protocol"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "stave-lsp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1"
stave-app = { path = "../stave-app" }
stave-ide = { path = "../stave-ide" }
stave-lang = { path = "../stave-lang" }
stave-modules = { path = "../stave-modules" }
thiserror = "2"

[dev-dependencies]
insta = "1"

[lints]
workspace = true
