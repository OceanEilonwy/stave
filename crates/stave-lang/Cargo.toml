[package]
name = "stave-lang"
description = "Syntax tree, units and placement vocabulary for the .stave project format"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
## Derive `serde::Serialize` for the value and vocabulary types that later
## stages store in their results (lengths, angles, faces, directions, ...).
serde = ["dep:serde"]

[dependencies]
rowan = "0.17"
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2"

[dev-dependencies]
insta = "1"

[lints]
workspace = true
