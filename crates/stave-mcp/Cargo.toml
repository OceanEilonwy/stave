[package]
name = "stave-mcp"
description = "Stave as an MCP server: AI apps open, check and try changes to .stave projects"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rmcp = { version = "3.11", features = ["server", "macros", "transport-io"] }
roxmltree = "0.21"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stave-app = { path = "../stave-app" }
stave-lang = { path = "../stave-lang" }
stave-model = { path = "../stave-model" }
stave-modules = { path = "../stave-modules" }
stave-scene = { path = "../stave-scene" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }

[dev-dependencies]
rmcp = { version = "3.11", features = ["client", "server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync"] }

[lints]
workspace = true
