# No tree-sitter grammar exists for Stave yet, so Zed colours nothing
# itself; the language server supplies diagnostics, completion, hover,
# rename and the rest.
name = "Stave"
path_suffixes = ["stave"]
line_comments = ["/// ", "// "]
block_comment = ["/* ", " */"]
tab_size = 2
hard_tabs = false
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
word_characters = ["_"]
